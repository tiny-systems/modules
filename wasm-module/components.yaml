- name: wasm_eval
  description: WASM Eval
  info: 'Escape hatch for PRODUCED agents: run arbitrary compiled logic inline when no typed component
    fits, in a sandbox. Fast per-request once compiled — but a cold compile runs into minutes, so for
    quick interactive work prefer js_eval (no compile step). Compile and run a user-supplied program as
    WebAssembly per incoming request. Write source in Settings.Source.Content (TinyGo for now — read JSON
    from os.Stdin, write JSON to os.Stdout). Declare Settings.inputData and Settings.outputData so edges
    validate without scenarios. Compile errors surface in node status; runtime errors route to the Error
    port when enabled. Enable Settings.EnableStatusPort to emit lifecycle events on the Status port —
    useful because cold compiles can run into minutes and you want to know the node isn''t dead. Context
    passes through untouched; the wasm module does not see it.'
  tags:
  - wasm
  - wasi
  - tinygo
  - eval
  - engine
