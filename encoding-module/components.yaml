# Generated by `tools components-info --json` at release. Do not edit by hand.
# Discovery only: name/description/info/tags. Ports come from a running node.
- name: csv_decode
  description: CSV Decoder
  info: 'Parses CSV into one object per row, with quoting, embedded newlines and escaped delimiters handled — the
    things a hand-written split gets wrong in a way that shifts every column after the offending field. SET THE
    `rows` SETTING to an example row, for the same reason json_decode needs one: a string has no shape, so an expression
    over a column nobody declared resolves to null at runtime instead of failing when the flow is built. Wire array_split
    after it so each row arrives as its own message. Every field is a string unless inferTypes is on — turn it on
    when a column is compared or summed, and leave it off when a column holds an identifier, because 007 and 01234
    do not survive inference. Check truncated: a file larger than maxRows is decoded in part.'
  tags:
  - csv
  - agent_tool
- name: csv_encode
  description: CSV Encoder
  info: Writes objects out as CSV, quoting whatever needs it — a value containing the delimiter, a quote or a newline
    survives instead of shifting every column after it. Set columns to fix the order and to leave out fields a report
    should not carry; without it the columns are every key found, sorted, which is stable but rarely the order a
    reader wants. Wire collect before this when the rows arrive one at a time.
  tags:
  - csv
  - agent_tool
