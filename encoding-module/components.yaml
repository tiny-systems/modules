- name: text_chunk
  description: Text Chunk
  info: 'Splits a document into overlapping pieces for embedding — the step between having a document and having
    something vector_upsert can store. Breaks on a paragraph, line or sentence boundary where it can so a piece
    is a whole thought, and carries each piece''s offsets so a citation points back into the original. Wire array_split
    after it to send one chunk at a time to embed_text, then vector_upsert. Overlap exists so a sentence that straddles
    a boundary is still findable; without it, retrieval misses exactly the passages that span two chunks. Check
    truncated on the way out: a document that produced more pieces than maxChunks is indexed in part, and a half-indexed
    document answers questions wrongly rather than not at all.'
  tags:
  - text
  - rag
  - embedding
