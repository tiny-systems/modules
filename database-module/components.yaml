# Generated by `tools components-info --json` at release. Do not edit by hand.
# Discovery only: name/description/info/tags. Ports come from a running node.
- name: postgres_exec
  description: Postgres Exec
  info: Executes INSERT/UPDATE/DELETE against Postgres with positional parameters. Connection pool is
    cached per DSN across calls.
  tags:
  - Postgres
  - SQL
  - DB
- name: postgres_query
  description: Postgres Query
  info: Runs SELECT against Postgres and returns rows as a list of objects keyed by column name. Configure
    expected row shape in settings so downstream edges can navigate the result. Connection pool is cached
    per DSN.
  tags:
  - Postgres
  - SQL
  - DB
- name: redis_dedup
  description: Redis Dedup
  info: Atomic 'first seen' check via SET NX EX. Routes new IDs to the New port and duplicates to the
    Seen port. Redis client is cached per URL across calls.
  tags:
  - Redis
  - Dedup
  - DB
- name: redis_get
  description: Redis Get
  info: Reads a key from Redis. Emits found=false with empty value when the key does not exist; the error
    port is reserved for actual Redis failures.
  tags:
  - Redis
  - DB
- name: redis_set
  description: Redis Set
  info: Sets a key in Redis. Optional TTL via ttlSeconds (0 = no expiry). Optional NX (set only if key
    does not already exist).
  tags:
  - Redis
  - DB
- name: vector_search
  description: Vector Search
  info: kNN over a pgvector column. Returns the top-K nearest rows by configurable distance metric, with
    a normalised score in [0,1]. Optional JSONB metadata filter restricts the search. Pair with vector_upsert
    to build a RAG store — on the zero-config bundle a query before anything is stored returns an empty
    result (not an error), so the question path answers gracefully on an empty memory.
  tags:
  - Vectors
  - Postgres
  - pgvector
  - RAG
  - DB
  - kNN
- name: vector_upsert
  description: Vector Upsert
  info: 'Writes an embedding row into a pgvector table. INSERT ... ON CONFLICT (id) DO UPDATE — existing
    rows are overwritten. Zero-config on the in-cluster bundle: leave DSN empty and the table is created
    automatically on first write (vector dimension inferred from the embedding), and an empty id is auto-generated
    — so wire embed_text.embedding straight into this node''s embedding with NO id-generating node in
    between. Only an explicit external DSN requires you to pre-create the table.'
  tags:
  - Vectors
  - Postgres
  - pgvector
  - RAG
  - DB
