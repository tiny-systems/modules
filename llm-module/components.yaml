# Generated by `tools components-info --json` at release. Do not edit by hand.
# Discovery only: name/description/info/tags. Ports come from a running node.
- name: llm_chat
  description: LLM Chat
  info: 'Stateless multi-turn conversation primitive. Caller supplies the full Messages history per  Set
    Output JSON Schema in settings to force a schema-conforming reply on response.structured.call; component
    makes the API call and emits the updated history (with the assistant turn appended) on Response.Messages.
    Persist via document_store or kv around llm_chat: load → llm_chat → save. Defaults to Anthropic''s
    Messages API; switch Provider to ''openai'' for OpenAI Chat Completions or any OpenAI-compatible endpoint
    (Ollama, vLLM, OpenRouter, Azure OpenAI) via BaseURL. For tool-using agents, llm_tools is the right
    primitive; llm_chat is for pure conversation. Caches the system prompt when CacheSystem=true (Anthropic
    only) so long system prompts amortise across turns.'
  tags:
  - LLM
  - Anthropic
  - OpenAI
  - Chat
  - Conversation
- name: llm_complete
  description: LLM Complete
  info: 'Single-turn completion. Defaults to Anthropic''s Messages API (with prompt caching on the system
    prompt); switch Provider to ''openai'' for OpenAI Chat Completions or any OpenAI-compatible endpoint
    (Ollama, vLLM, OpenRouter, Azure OpenAI) via BaseURL. Emits text, model, usage, and stop reason on
    success; routes 429/529/5xx errors with retryable=true so upstream can decide whether to retry. Set
    Output JSON Schema in settings to force a schema-conforming reply: the parsed object lands on response.structured
    (read $.structured.<field>).'
  tags:
  - LLM
  - Anthropic
  - OpenAI
  - Claude
- name: llm_router
  description: LLM Router
  info: Route a message to one of N output ports based on LLM judgement. Configure Settings.Routes with
    {name, description} pairs — the model picks the best match per incoming message. Each route becomes
    an out_<lowercase(name)> output port. When EnableDefaultPort is true and confidence is below ConfidenceThreshold,
    routes to 'default'. Use for fuzzy intent classification, ticket triage, content moderation — anywhere
    boolean conditions would be too many to enumerate. The reasoning + confidence land in trace span attributes
    for observability. Output ports emit Context only — same shape as the deterministic router so downstream
    edges treat both identically.
  tags:
  - LLM
  - Anthropic
  - Router
  - Classify
- name: llm_tools
  description: LLM Tools
  info: 'ReAct / function-calling primitive. Declare tools in Settings; each becomes an out_<toolname>
    source port emitting {toolUseId, input, messages} when the model picks it. Multi-provider — Anthropic
    Messages tool_use (default) or OpenAI Chat Completions function calling via Provider=openai; BaseURL
    targets any OpenAI-compatible endpoint (Ollama, vLLM, OpenRouter). Component is stateless: caller
    supplies the full Messages history. To build a ReAct loop, wire out_<tool> → handler → another llm_tools.request
    with the previous response''s Messages plus a {role: tool, toolCallId, content} entry. Loop until
    the response port fires.'
  tags:
  - LLM
  - Anthropic
  - OpenAI
  - Tools
  - ReAct
  - Agent
- name: mcp_call
  description: MCP Call Tool
  info: 'Invokes a tool on a remote MCP server. Request takes {tool, arguments}; Result emits {text, structured,
    isError} plus the context unchanged. To use remote tools in a ReAct loop: declare them in llm_tools''
    Tools setting (discover them with mcp_tools), wire out_<tool> here mapping tool and {{$.input}} to
    arguments, then fold Result.text back into llm_tools.request as a {role: tool, toolCallId, content}
    message. A tool that reports its own failure arrives on Result with isError=true; transport failures
    go to the Error port and are marked retryable.'
  tags:
  - MCP
  - Agent
- name: mcp_tools
  description: MCP Discover Tools
  info: Lists the tools a remote MCP server offers. Emits them in llm_tools' declaration shape ({name,
    description, inputSchema}) so they can be copied into that component's Tools setting — llm_tools needs
    its tools declared in settings to derive out_<tool> ports, so discovery is a build-time step. Use
    mcp_call to actually invoke a tool. Provide the bearer token per-request rather than in settings.
  tags:
  - MCP
  - Agent
