  grpc-module:
    category: net
    description: gRPC client — call gRPC service methods
    source: github.com/tiny-systems/grpc-module
    versions:
    - chart: tinysystems/tinysystems-operator
      chartVersion: 0.2.10
      components:
      - description: gRPC request
        info: 'Calls a unary gRPC method on a remote server. Services, methods and
          message schemas are discovered at configuration time via server reflection,
          so no proto files are needed — the server must have the reflection service
          enabled. Connections use TLS with system root certificates by default; enable
          ''Insecure mode'' in settings to talk to plaintext (non-TLS) servers. Each
          request can attach call metadata: a Bearer Token field (sent as ''authorization:
          Bearer <token>'') and arbitrary key/value headers. An optional Keep Alive
          setting sends HTTP/2 pings to hold long-lived connections open. Only unary
          methods are supported — client, server and bidirectional streaming methods
          are not.'
        name: grpc_call
        tags:
        - grpc
        - client
      image: ghcr.io/tiny-systems/grpc-module:0.4.17
      version: 0.4.17
  http-module:
    category: net
    description: HTTP client and server components
    source: github.com/tiny-systems/http-module
    versions:
    - chart: tinysystems/tinysystems-operator
      chartVersion: 0.2.10
      components:
      - description: Basic Auth Headers Parser
        info: 'Extracts Basic Auth credentials from HTTP headers. In port receives:
          context + headers array. Out port always emits: {context, found, user, password}.
          If Authorization header with ''Basic'' scheme found, decodes base64 and
          sets found=true with user/password. Otherwise found=false.'
        name: http_auth_parse
        tags:
        - HTTP
        - Auth
      - description: HTTP Client
        info: 'Outbound HTTP request maker. Request port receives: context, method,
          timeout, URL, bearerToken, basicAuthUser/basicAuthPassword, headers, contentType,
          body. Auth fields set the Authorization header (bearer wins over basic;
          an explicit Authorization header overrides both). Blocks until HTTP response
          received. Response bodies are capped by maxResponseBytes in settings (default
          10MB); larger responses fail rather than OOM the pod. On success (status
          < 400): emits context + response on Response port. On failure or status
          >= 400: returns error, or if enableErrorPort=true in settings, emits on
          Error port instead.'
        name: http_request
        tags:
        - HTTP
        - Client
      - description: LogQL Query
        info: 'Searches Loki for log lines across every pod at once, which is what
          pod_logs_get cannot do — it needs an exact pod name. Returns each line with
          its stream labels, so an agent can say which pod and namespace produced
          it. The query needs a stream selector in braces: {namespace="prod"} |= "error".
          Addressed by URL, so an in-cluster Loki and Grafana Cloud work the same
          way; set the tenant header for multi-tenant installs. Give the credential
          per request from the trigger widget rather than storing it in the flow.
          Check truncated before concluding anything — a capped sample is not the
          whole picture.'
        name: logql_query
        tags:
        - Observability
        - Logs
        - Agent
      - description: PromQL Query
        info: Runs a PromQL query against any Prometheus-compatible API and returns
          the matching series with their labels. Set rangeMinutes to query a window
          instead of an instant — that is what shows a trend rather than a single
          number. Addressed by URL, so it works with an in-cluster Prometheus as well
          as Grafana Cloud, Amazon Managed Prometheus, Thanos, Mimir or VictoriaMetrics;
          set the tenant header for the multi-tenant ones. Give the credential per
          request from the trigger widget rather than storing it in the flow. A malformed
          query is permanent and will not be retried; an unreachable or overloaded
          backend is retryable.
        name: promql_query
        tags:
        - Observability
        - Metrics
        - Agent
      - description: HTTP Server
        info: HTTP request handler. The server does NOT run until a message arrives
          on the Start port — wire a signal (or cron) into Start to launch it (a cron
          would re-launch on every tick, so prefer signal for a long-running server).
          On start it exposes a public URL; read that URL from the _control port's
          ListenAddr (or enable the status port) — never guess the address. Each incoming
          HTTP request emits on Request port. Wire Request to processing logic, then
          wire result to Response port with statusCode (required), contentType (required),
          headers, body. To stop the server, enable the Stop port in settings and
          send it any message (context cancellation alone will NOT stop it — the runtime
          is distributed and durable).
        name: http_server
        tags:
        - HTTP
        - Server
        - sync_rpc
      image: ghcr.io/tiny-systems/http-module:0.5.40
      values: |
        rbac:
          extraRules:
          - apiGroups:
            - ""
            resources:
            - pods
            verbs:
            - get
          - apiGroups:
            - ""
            resources:
            - services
            verbs:
            - get
            - list
            - update
          - apiGroups:
            - networking.k8s.io
            resources:
            - ingresses
            verbs:
            - get
            - list
            - update
      version: 0.5.40
  js-module:
    category: core
    description: JavaScript eval — run JS to parse, transform, and compute over flow
      data (the code/eval component)
    source: github.com/tiny-systems/js-module
    versions:
    - chart: tinysystems/tinysystems-operator
      chartVersion: 0.2.10
      components:
      - description: JS Eval
        info: 'Escape hatch: run arbitrary logic inline when no typed component does
          what you need — reshape data, branch, compute, glue a flow together. No
          compile step, runs instantly (prefer this over wasm_eval for interactive
          work). Each invocation is capped by timeoutSeconds (default 30s) — runaway
          loops are interrupted, not wedged. JavaScript evaluation (ECMAScript 5.1
          + ESM imports). Script must export a default function: export default function(inputData)
          { return { result: inputData.value * 2 }; }. The function receives inputData
          as its only argument; the return value becomes outputData on the response
          port. Context is NOT available inside the script — it passes through automatically
          from request to response. Define settings.inputData (example + schema of
          the script''s argument) and settings.outputData (example + schema of the
          script''s return) so the validator can check incoming and outgoing edges
          without running the flow.'
        name: js_eval
        tags:
        - js
        - javascript
        - engine
      image: ghcr.io/tiny-systems/js-module:0.3.20
      version: 0.3.20
  kubernetes-module:
    category: infra
    description: Kubernetes ops — pods, deployments, services, watches
    source: github.com/tiny-systems/kubernetes-module
    versions:
    - chart: tinysystems/tinysystems-operator
      chartVersion: 0.2.10
      components:
      - description: ConfigMap Patch
        info: 'Set or remove a key in a Kubernetes ConfigMap. On set: creates the
          ConfigMap if it doesn''t exist, or upserts the key. On remove: deletes the
          key from the ConfigMap data.'
        name: configmap_patch
        tags:
        - Kubernetes
        - ConfigMap
        - Configuration
      - description: Custom Resource List
        info: Lists any Kubernetes resource by API version and kind. Works with built-in
          resources (Pods, Deployments) and custom resources (Certificates, VirtualServices).
          Returns name, namespace, labels, spec, and status for each item. CRDs outside
          the module's built-in RBAC must be granted at install time via the chart's
          rbac.extraRules values; a 403 from this component includes the exact helm
          command.
        name: custom_resource_list
        tags:
        - Kubernetes
        - CRD
        - Custom Resource
        - List
      - description: DaemonSet List
        info: Lists Kubernetes DaemonSets with scheduling status and health information.
        name: daemonset_list
        tags:
        - Kubernetes
        - DaemonSets
        - List
      - description: Deployment List
        info: Lists Kubernetes Deployments with replica status, conditions, and health
          information.
        name: deployment_list
        tags:
        - Kubernetes
        - Deployments
        - List
      - description: Deployment Scale
        info: Scale a Kubernetes Deployment to a specified replica count.
        name: deployment_scale
        tags:
        - Kubernetes
        - Deployments
        - Scale
      - description: Deployment Update
        info: Update a Kubernetes Deployment's images, environment variables, resources,
          replicas, and metadata.
        name: deployment_update
        tags:
        - Kubernetes
        - Deployments
        - Update
      - description: Event Watcher
        info: Watch Kubernetes Events for warnings and errors. Use to detect ImagePullBackOff,
          CrashLoopBackOff, scheduling failures, and other cluster issues.
        name: event_watch
        tags:
        - Kubernetes
        - Events
        - Alerts
        - Monitoring
      - description: Pod Create
        info: Create a Kubernetes Pod. Use to run one-off tasks, test image pulls,
          or spawn workers. Set command to ['true'] and restartPolicy to Never for
          a quick image pull test.
        name: pod_create
        tags:
        - Kubernetes
        - Pods
        - Create
      - description: Pod Delete
        info: Delete a Kubernetes Pod by name. Useful for forcing pod restart or cleanup.
        name: pod_delete
        tags:
        - Kubernetes
        - Pods
        - Delete
      - description: Pod List
        info: Lists Kubernetes Pods with container statuses, phases, and problem detection.
        name: pod_list
        tags:
        - Kubernetes
        - Pods
        - List
      - description: Pod Logs
        info: Get logs from a specific pod by exact name. Use pod_list to find pods
          first if needed.
        name: pod_logs_get
        tags:
        - Kubernetes
        - Pods
        - Logs
      - description: Pod Log Watcher
        info: Watch pod logs in real-time for keyword matches. Streams logs from all
          pods matching namespace and label filters, emits events on match. Discovers
          new pods every 30s and reconnects on stream interruption.
        name: pod_logs_watch
        tags:
        - Kubernetes
        - Pods
        - Logs
        - Watch
        - Monitoring
      - description: Pod Status
        info: 'Counts pods BY PHASE for a label selector you must supply. Returns
          running/pending/failed/succeeded totals, a single healthy boolean for the
          whole set, and per-pod details. Two limits decide whether this fits: the
          label selector is required, so it cannot answer for a whole namespace; and
          phase is not health — a pod in CrashLoopBackOff or ImagePullBackOff is phase
          Running, so it lands in the running count and no counter here reports it.
          To find unhealthy pods, or to cover a namespace, use pod_list and read its
          per-pod hasProblem flag.'
        name: pod_status_get
        tags:
        - Kubernetes
        - ChatOps
        - Pods
        - Status
      - description: Pod Update
        info: 'Update a Kubernetes Pod''s labels and annotations. Note: Pod spec cannot
          be modified after creation.'
        name: pod_update
        tags:
        - Kubernetes
        - Pods
        - Update
      - description: Pod Watcher
        info: Watch Kubernetes Pods for status changes. Emits typed events with pod
          phase, container states, and problem detection.
        name: pod_watch
        tags:
        - Kubernetes
        - Pods
        - Watch
        - Monitoring
      - description: Sandbox Run
        info: 'Runs a script in a throwaway Kubernetes Job and returns its output
          and exit code. Built for code an agent wrote: the container runs as non-root
          with a read-only root filesystem, no service-account token, dropped capabilities,
          and CPU/memory limits, and is deleted after it finishes. A script that exits
          non-zero is a normal Result with that exit code, not a flow failure — only
          infrastructure problems reach the Error port. Blocks until the script finishes,
          so keep it short; the timeout is capped at 240s. The script is passed to
          the interpreter as an argument, so choose an image that contains it (python:3.12-slim,
          node:22-alpine, busybox). Nothing restricts network egress by default —
          run it in a namespace with a restrictive NetworkPolicy if the script must
          not reach the cluster.'
        name: sandbox_run
        tags:
        - Kubernetes
        - Sandbox
        - Agent
      - description: Secret Get
        info: Read a Kubernetes Secret by name. Returns decoded string data. Use to
          read docker-registry secrets (regcred), TLS certs, or any opaque secret.
          Specify key to get a single value only — the other keys are not emitted.
          Leave key empty to get all keys.
        name: secret_get
        tags:
        - Kubernetes
        - Secret
        - Configuration
      - description: Service List
        info: Lists Kubernetes Services with ports, selectors, and endpoint information.
        name: service_list
        tags:
        - Kubernetes
        - Services
        - List
      - description: Service Update
        info: Update a Kubernetes Service's selector, ports, labels, or annotations.
        name: service_update
        tags:
        - Kubernetes
        - Services
        - Update
      - description: StatefulSet List
        info: Lists Kubernetes StatefulSets with replica status, revisions, and health
          information.
        name: statefulset_list
        tags:
        - Kubernetes
        - StatefulSets
        - List
      - description: Webhook Register
        info: Register or delete a Kubernetes MutatingWebhookConfiguration. Use to
          subscribe to cluster events at the admission level — intercept resource
          creation/updates before they happen.
        name: webhook_register
        tags:
        - Kubernetes
        - Webhook
        - Admission
        - Policy
      - description: Workload List
        info: Lists Kubernetes workload resources (Deployments, StatefulSets, DaemonSets)
          with optional filtering by namespace and label selector. Returns resource
          details including name, namespace, kind, labels, replicas, and status.
        name: workload_list
        tags:
        - Kubernetes
        - Workloads
        - List
      - description: Workload Restart
        info: Performs a rollout restart on a Deployment, StatefulSet, or DaemonSet
          by name. Triggers a rolling update by setting the restart annotation.
        name: workload_restart
        tags:
        - Kubernetes
        - Restart
