        tags:
        - json
      - description: JWT Encoder
        info: Generates JWT token
        name: jwt_encode
        tags:
        - jwt
      - description: JWT Decoder
        info: Verifies and decodes JWT token
        name: jwt_decode
        tags:
        - jwt
      - description: XML Encoder
        info: Encodes input document with XML
        name: xml_encode
        tags:
        - xml
