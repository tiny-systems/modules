    category: core
    description: Encoding — JSON, XML, JWT, and Go templates
    source: github.com/tiny-systems/encoding-module
    versions:
    - chart: tinysystems/tinysystems-operator
      chartVersion: 0.2.10
      components:
      - description: Go Template Engine
        info: Render templates using text/template standard package. Supports layouts
          and partials. Output is not HTML-escaped, suitable for JSON, plain text,
          and other formats.
        name: go_template
        tags:
        - html
        - template
