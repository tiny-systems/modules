  llm-module:
    category: ai
    description: LLM chat, completion, and tool-calling
    source: github.com/tiny-systems/llm-module
    versions:
    - chart: tinysystems/tinysystems-operator
      chartVersion: 0.2.10
      components:
      - description: LLM Chat
        info: 'Stateless multi-turn conversation primitive. Caller supplies the full
          Messages history per  Set Output JSON Schema in settings to force a schema-conforming
          reply on response.structured.call; component makes the API call and emits
          the updated history (with the assistant turn appended) on Response.Messages.
          Persist via document_store or kv around llm_chat: load → llm_chat → save.
          Defaults to Anthropic''s Messages API; switch Provider to ''openai'' for
          OpenAI Chat Completions or any OpenAI-compatible endpoint (Ollama, vLLM,
          OpenRouter, Azure OpenAI) via BaseURL. For tool-using agents, llm_tools
          is the right primitive; llm_chat is for pure conversation. Caches the system
          prompt when CacheSystem=true (Anthropic only) so long system prompts amortise
          across turns.'
        name: llm_chat
        tags:
        - LLM
        - Anthropic
        - OpenAI
        - Chat
        - Conversation
      - description: LLM Complete
        info: 'Single-turn completion. Defaults to Anthropic''s Messages API (with
          prompt caching on the system prompt); switch Provider to ''openai'' for
          OpenAI Chat Completions or any OpenAI-compatible endpoint (Ollama, vLLM,
          OpenRouter, Azure OpenAI) via BaseURL. Emits text, model, usage, and stop
          reason on success; routes 429/529/5xx errors with retryable=true so upstream
          can decide whether to retry. Set Output JSON Schema in settings to force
          a schema-conforming reply: the parsed object lands on response.structured
          (read $.structured.<field>).'
        name: llm_complete
        tags:
        - LLM
        - Anthropic
        - OpenAI
        - Claude
      - description: LLM Router
        info: Route a message to one of N output ports based on LLM judgement. Configure
          Settings.Routes with {name, description} pairs — the model picks the best
          match per incoming message. Each route becomes an out_<lowercase(name)>
          output port. When EnableDefaultPort is true and confidence is below ConfidenceThreshold,
          routes to 'default'. Use for fuzzy intent classification, ticket triage,
          content moderation — anywhere boolean conditions would be too many to enumerate.
          The reasoning + confidence land in trace span attributes for observability.
          Output ports emit Context only — same shape as the deterministic router
          so downstream edges treat both identically.
        name: llm_router
        tags:
        - LLM
        - Anthropic
        - Router
        - Classify
      - description: LLM Tools
        info: 'ReAct / function-calling primitive. Declare tools in Settings; each
          becomes an out_<toolname> source port emitting {toolUseId, input, messages}
          when the model picks it. Multi-provider — Anthropic Messages tool_use (default)
          or OpenAI Chat Completions function calling via Provider=openai; BaseURL
          targets any OpenAI-compatible endpoint (Ollama, vLLM, OpenRouter). Component
          is stateless: caller supplies the full Messages history. To build a ReAct
          loop, wire out_<tool> → handler → another llm_tools.request with the previous
          response''s Messages plus a {role: tool, toolCallId, content} entry. Loop
          until the response port fires.'
        name: llm_tools
        tags:
        - LLM
        - Anthropic
        - OpenAI
        - Tools
        - ReAct
        - Agent
      - description: MCP Call Tool
        info: 'Invokes a tool on a remote MCP server. Request takes {tool, arguments};
          Result emits {text, structured, isError} plus the context unchanged. To
          use remote tools in a ReAct loop: declare them in llm_tools'' Tools setting
          (discover them with mcp_tools), wire out_<tool> here mapping tool and {{$.input}}
          to arguments, then fold Result.text back into llm_tools.request as a {role:
          tool, toolCallId, content} message. A tool that reports its own failure
          arrives on Result with isError=true; transport failures go to the Error
          port and are marked retryable.'
        name: mcp_call
        tags:
        - MCP
        - Agent
      - description: MCP Discover Tools
        info: Lists the tools a remote MCP server offers. Emits them in llm_tools'
          declaration shape ({name, description, inputSchema}) so they can be copied
          into that component's Tools setting — llm_tools needs its tools declared
          in settings to derive out_<tool> ports, so discovery is a build-time step.
          Use mcp_call to actually invoke a tool. Provide the bearer token per-request
          rather than in settings.
        name: mcp_tools
        tags:
        - MCP
        - Agent
      image: ghcr.io/tiny-systems/llm-module:0.10.23
      version: 0.10.23
  storage-module:
    category: data
    description: S3-compatible blob storage — put, get, list, and presign objects
      (S3, MinIO, R2, GCS interop)
    source: github.com/tiny-systems/storage-module
    versions:
    - chart: tinysystems/tinysystems-operator
      chartVersion: 0.2.10
      components:
      - description: Blob Get
        info: 'Downloads an object from an S3-compatible store (AWS S3, MinIO, Cloudflare
          R2, GCS interop) and emits {data, contentType, size}. Use it to read back
          what blob_put stored, or to pull an externally produced file — a data dump,
          an uploaded CSV — into the flow. Bucket precedence: request.bucket wins;
          empty falls back to settings.bucket. Objects larger than maxBytes (default
          10485760 = 10 MiB) are refused with a permanent error naming the actual
          size — blobs travel as in-flow message payloads, so raise maxBytes deliberately,
          not reflexively. For binary objects set asBase64=true: data is then standard
          base64 of the object bytes (size still counts the original bytes). Text
          objects can be read as-is with asBase64=false.'
        name: blob_get
        tags:
        - Storage
        - S3
        - MinIO
        - Blob
        - Download
      - description: Blob List
        info: 'Lists objects in an S3-compatible store (AWS S3, MinIO, Cloudflare
          R2, GCS interop) by prefix and emits {items: [{key, size, lastModified,
          etag}], truncated}. Use it to discover what to blob_get or blob_presign
          — e.g. all of reports/2026-08/. Bucket precedence: request.bucket wins;
          empty falls back to settings.bucket. Listing is recursive under the prefix.
          At most max items are returned (default 100, hard cap 1000); truncated=true
          means more matched — narrow the prefix rather than paging, there is no cursor.
          items is an empty array, not an error, when nothing matches.'
        name: blob_list
        tags:
        - Storage
        - S3
        - MinIO
        - Blob
        - List
      - description: Blob Presign
        info: 'Mints a time-limited presigned URL for one object in an S3-compatible
          store (AWS S3, MinIO, Cloudflare R2, GCS interop) and emits {url}. The URL
          carries its own signature: whoever holds it can GET (download) or PUT (upload)
          that one object over plain HTTP until it expires — no credentials, and the
          bytes never ride through the flow. Typical use: blob_put a report, blob_presign
          it, send the link to Slack or email. Bucket precedence: request.bucket wins;
          empty falls back to settings.bucket. Expiry defaults to 900s (15 min) and
          is capped at 604800s (7 days — the S3 signing limit; longer requests fail
          with a permanent error). Signing happens locally; note that a GET URL for
          a missing key still signs fine — the holder gets a 404 when using it. For
          in-cluster MinIO endpoints the URL points at the internal host, reachable
          only where the cluster DNS resolves.'
        name: blob_presign
        tags:
        - Storage
        - S3
        - MinIO
        - Blob
        - Presign
        - Share
      - description: Blob Put
        info: 'Uploads an object to an S3-compatible store (AWS S3, MinIO, Cloudflare
          R2, GCS interop) and emits {bucket, key, etag, size}. Use it to persist
          anything a flow produced or fetched — a report, a CSV, an attachment — so
          blob_get can read it back or blob_presign can hand out a download link.
          Bucket precedence: request.bucket wins; empty falls back to settings.bucket;
          neither set is an error. Text content goes in data as-is; for binary content
          set dataBase64=true and pass standard base64 in data — the store receives
          the decoded bytes. Set contentType (default application/octet-stream) so
          downloads serve with the right type. Network failures during upload are
          marked retryable: S3 PutObject is a full-object replace of the same key
          with the same bytes, so re-running a possibly-landed upload converges on
          the same stored object.'
        name: blob_put
        tags:
        - Storage
        - S3
        - MinIO
        - Blob
        - Upload
      image: ghcr.io/tiny-systems/storage-module:0.1.1
      version: 0.1.1
  store-module:
    category: data
    description: Document store — persist and query JSON documents
    source: github.com/tiny-systems/store-module
    versions:
    - chart: tinysystems/tinysystems-operator
      chartVersion: 0.2.10
      components:
      - description: Conversation Memory
        info: 'Atomic conversation memory for llm_chat — keyed by conversationId,
          backed by bbolt on the PVC. append does load+append+trim+save in ONE transaction,
          so two concurrent turns can''t lose each other''s messages (unlike a get→append→put
          chain around document_store). Intended wiring: append the user turn → feed
          the response''s messages into llm_chat → append the assistant turn; or make
          a single append of both turns after llm_chat responds. Every append/get
          response carries the full current window, ready to feed llm_chat directly.
          get on an unknown conversationId returns an empty messages array — not an
          error — so start a cold conversation by appending the user turn first (that
          also satisfies llm_chat''s minItems:1). Message shape is whatever llm_chat
          uses ({role, content, ...}); objects pass through unchanged. Settings.MaxMessages
          windows each conversation to the most recent N messages (default 50; 0 =
          unlimited, unbounded growth). clear deletes a conversation.'
        name: conversation
        tags:
        - Store
        - Memory
        - Conversation
        - Chat
        - LLM
        - bbolt
      - description: Document Store
        info: Embedded key/value store backed by bbolt + PVC. Four operation ports
          (put, get, delete, find) each with a matching result port. Use as the storage
          layer for chat history, agent scratchpads, intermediate flow state — anywhere
          SDK State's 900KB cap is too tight. Settings.Collections declares named
          buckets so typo'd collection names fail at config time. Single-replica only
          (bbolt locks the file). For HA persistence use postgres_* or redis_* from
          database-module-v0.
        name: document_store
        tags:
        - Store
        - KV
        - Persistence
        - bbolt
        - Embedded
      image: ghcr.io/tiny-systems/store-module:0.2.1
      version: 0.2.1
  wasm-module:
    category: core
    description: WebAssembly — run WASM modules over flow data
    source: github.com/tiny-systems/wasm-module
    versions:
    - chart: tinysystems/tinysystems-operator
      chartVersion: 0.2.10
      components:
      - description: WASM Eval
        info: 'Escape hatch for PRODUCED agents: run arbitrary compiled logic inline
          when no typed component fits, in a sandbox. Fast per-request once compiled
          — but a cold compile runs into minutes, so for quick interactive work prefer
          js_eval (no compile step). Compile and run a user-supplied program as WebAssembly
          per incoming request. Write source in Settings.Source.Content (TinyGo for
          now — read JSON from os.Stdin, write JSON to os.Stdout). Declare Settings.inputData
          and Settings.outputData so edges validate without scenarios. Compile errors
          surface in node status; runtime errors route to the Error port when enabled.
          Enable Settings.EnableStatusPort to emit lifecycle events on the Status
          port — useful because cold compiles can run into minutes and you want to
          know the node isn''t dead. Context passes through untouched; the wasm module
          does not see it.'
        name: wasm_eval
        tags:
        - wasm
        - wasi
        - tinygo
        - eval
        - engine
      image: ghcr.io/tiny-systems/wasm-module:0.3.15
      version: 0.3.15
