modules:
  common-module:
    category: core
    description: Core flow components — signal, transform, router, delay, kv, run
    source: github.com/tiny-systems/common-module
    versions:
    - chart: tinysystems/tinysystems-operator
      chartVersion: 0.2.10
      components:
      - description: Array Get
        info: 'Get an array element by 1-based index. Input: {array, index}; returns
          {item, index} or an error if the index is out of range.'
        name: array_get
        tags:
        - SDK
        - ARRAY
        - agent_tool
      - description: Async
        info: Non-blocking pass-through. Returns immediately (unblocks sender), then
          emits context on Out in a goroutine. Limits concurrent goroutines via maxConcurrency
          setting to prevent memory issues.
        name: async
        tags:
        - SDK
      - description: Budget Guard
        info: 'Bounds an agent loop. Wire it into the cycle — typically between a
          tool result and the model it feeds — and it emits on Proceed while the loop
          is within budget, or on Exceeded once it is not. Ceilings: iterations always,
          plus optional total tokens and cost. Map the model''s usage into inputTokens/outputTokens,
          and map iteration/spentTokens/spentUSD from Proceed back into the guard
          on each pass; the counters travel in the payload so one guard can supervise
          many loops at once. Without something like this a ReAct loop has no limit
          at all: the graph closes the circuit and every iteration bills. Wire Exceeded
          to a report, or to ask so a human decides whether to continue.'
        name: budget_guard
        tags:
        - SDK
        - Agent
        - Safety
      - description: Chat with a human
        info: 'The flow''s human touchpoint: one conversation widget on the dashboard.
          A human types → Message port (carry requestId back on Say to mark it answered).
          The flow speaks → Say port (markdown bubble; role system/error renders as
          a note). The flow asks → Ask port: a question card with the form''s buttons
          appears in the thread and the submission emits on Answer as {questionId,
          values, context} — wire Answer to the gated action. Questions queue FIFO,
          persist across restarts, and expire onto Error after timeoutSeconds. The
          flow starts over → Clear port: the thread and any pending questions are
          wiped (store memory clears separately). The thread is display only (historyLimit);
          keep real conversation memory in a store component. Replaces prompt and
          ask.'
        name: chat
        tags:
        - SDK
        - dashboard
        - Human
      - description: Collect
        info: 'Fan-in for map-reduce — the pair of array_split. array_split emits
          {context, item, index, total} per element; route each item through the per-item
          work, then map into Item here: groupKey MUST be unique per fan-out (e.g.
          $.context.runId — every item of one array shares it, different runs differ),
          and index/total come straight from array_split. Items are buffered per groupKey
          in the node''s State, so assembly survives restarts and is multi-replica
          safe. Once a group holds all `total` items, Response emits {context, items}:
          items ordered by index regardless of arrival order (a duplicate index overwrites,
          never double-counts), context taken from the group''s LAST arriving item.
          Groups older than timeoutSeconds fail onto the Error port as {context, groupKey,
          received, total, error}. Expiry is passive — checked when messages arrive
          — so an idle node holds stragglers until the next message on any group.
          State is capped at ~900KB per node: keep buffered items small (carry IDs,
          not blobs) or lower maxGroups.'
        name: collect
        tags:
        - SDK
        - ARRAY
      - description: Cron
        info: 'Scheduled emitter using cron expressions. Click Start to begin emitting
          context on Out port according to the schedule. Supports standard cron syntax
          (minute hour day-of-month month day-of-week). Examples: ''*/5 * * * *''
          (every 5 min), ''0 */2 * * *'' (every 2 hours), ''0 9 * * 1-5'' (9 AM weekdays).
          Click Stop to pause. Cron survives pod restarts and leadership changes.'
        name: cron
        tags:
        - SDK
      - description: Debug
        info: Message sink for inspection. Receives messages on In (no output ports).
          Displays last received message in Control port. Use as flow endpoint to
          inspect data or terminate unused branches.
        name: debug
        tags:
        - SDK
      - description: Delay
        info: Timed pause. Receives context + delay (ms) on In, sleeps for specified
          duration (blocking upstream), then emits context on Out. Use for rate limiting
          or adding pauses between operations.
        name: delay
        tags:
        - SDK
      - description: Display
        info: 'Shows one piece of text on the dashboard, rendered as markdown. Use
          it as a flow''s answer panel: wire the value a person actually reads into
          Text (e.g. text: "{{$.outputData.messages[0].content}}") rather than passing
          the whole message, which renders as a wall of form fields. Has no output
          ports — it is a sink. Enable it as a dashboard widget to give a flow a readable
          result. For a panel of written text — a readme describing what the agent
          does — wire nothing and set settings.text instead: that ships with the flow,
          whereas text delivered at runtime does not survive an export and leaves
          a blank card for whoever installs it.'
        name: display
        tags:
        - SDK
        - dashboard
      - description: Flow Telemetry
        info: 'Reads the platform''s own execution traces, so a flow can inspect how
          flows are running. Without a traceId it lists runs in the window (id, span
          count, error count, duration) — set errorsOnly to find failures. With a
          traceId it returns that run''s hops, each naming the source and target port,
          which is how you find WHERE a run broke. Needs the project''s resource name.
          Works on any install: the traces come from the otel-collector the operator
          already deploys, with no Prometheus or external backend involved. Pair it
          with an LLM to diagnose a failing automation, or with a cron to report what
          broke overnight.'
        name: flow_telemetry
        tags:
        - SDK
        - Observability
        - Agent
      - description: Form
        info: 'A form widget that reports its outcome in place: a person fills the
          configured fields and presses Submit, the values emit on Out, and whatever
          the flow writes to Result appears under the button — one card, no separate
          status panel. The settings-form pattern is the canonical use: a masked API-key
          field (author the context schema with writeOnly + format:"password") → validate
          against the real API → store under a handle → Result: "saved ••••last4 ✓".
          The result line persists across restarts. For free-form conversation use
          chat; for a fire-and-forget trigger use signal.'
        name: form
        tags:
        - SDK
        - dashboard
      - description: Group By
        info: 'Groups an array of items by a specified field path. Input: items array
          + groupByPath (e.g., ''labels.app''). Output: array of groups sorted by
          key, each with key, items, and count.'
        name: group_by
        tags:
        - SDK
        - Array
        - Aggregate
      - description: Inject
        info: Injects stored configuration into passing messages. Send config once,
          then every message passing through gets it attached. Config persists across
          pod restarts via metadata.
        name: inject
        tags:
        - Data
        - Config
        - Enrich
      - description: Key-Value Store
        info: Key-value store backed by TinyNode metadata via the SDK State primitive.
          Stores documents with a configurable schema and primary key. Supports JSONPath
          queries. Multi-replica safe — all common-module replicas observe the same
          store via the K8s watch.
        name: kv
        tags:
        - KV
        - Storage
        - Data
      - description: Modify
        info: Data transformer for connecting output back to input on the SAME node
          (e.g., http_server request→response loops). AVOID using modify between DIFFERENT
          nodes - configure data mapping directly on the edge instead. Edge configuration
          can set literal values and map fields without needing modify in between.
        name: transform
        tags:
        - SDK
      - description: Retry
        info: 'Explicit retry supervisor with bounded attempts and configurable backoff.
          Pairs with the error port of any component that emits the canonical module.ErrorMessage
          shape {context, error, retryable} (build it with module.NewError; mark transient
          failures with module.Retryable). Any conforming component works — llm_*,
          http_request, and any third-party module that uses the SDK error contract.
          Stateless: attempt count rides in the payload, so the same component can
          supervise many concurrent flows without cross-talk.'
        name: retry
        tags:
        - SDK
        - Resilience
        - Backoff
      - description: Router
        info: 'Conditional message router. Configure routes via settings (e.g., routes=["POST",
          "OTHER"]). Output ports are named out_<lowercase(route)> (e.g., out_post,
          out_other). Input: context (data to forward) + conditions array (each with
          route name and boolean). Routes context to FIRST condition where condition=true.
          If NO condition is true: with enableDefaultPort=true, routes to ''default''
          port (leave unwired to silently drop); with enableDefaultPort=false, returns
          an error to the caller. Prefer enableDefaultPort=true when unmatched messages
          should be ignored. Each out_<route> emits the routed message under `context`
          — a downstream edge reads `$.context.<field>`.'
        name: router
        tags:
        - SDK
      - description: Start Run & Reply
        info: Starts a run and immediately returns its id, so a caller — like an HTTP
          request — gets an instant reply while the work keeps going. Send your payload
          in on In; wire Started back to your reply (e.g. an HTTP Response) to hand
          back the run id; everything after Out runs as a run you can watch and retry.
        name: run_start
        tags:
        - run
        - reply
      - description: Run Status
        info: 'Checks a run''s progress by id: whether the run is known (found), complete,
          or failed, how many steps are still pending, and the per-step details. Pair
          with Start Run & Reply behind an HTTP request for instant-reply-then-check.'
        name: run_status
        tags:
        - run
        - status
      - description: Signal
        info: 'Flow trigger. Click Send to emit the configured context on Out and
          kick off the flow. Fire-and-forget: it emits once and returns — there is
          no running state and no Reset (the distributed runtime can''t cancel downstream
          work by context). To stop something the flow started, wire a Stop-capable
          component downstream (e.g. http_server''s Stop port). Use as an entry point.'
        name: signal
        tags:
        - SDK
      - description: Split Array
        info: 'Array iterator. Input: context + array. Emits one message per array
          element on Out, each containing {context, item, index, total} — index is
          the element''s 0-based position, total the array length, context the incoming
          message''s context passed through unchanged per item. Elements are processed
          sequentially - next item sent after previous Out completes. Use to process
          lists item by item. For map-reduce, pair with `collect`: route each item
          through the per-item work, map index/total (and a group key unique per source
          message) into collect, and it reassembles the array once all items arrive.'
        name: array_split
        tags:
        - SDK
        - ARRAY
      - description: Ticker
        info: Periodic emitter. Click Start to begin emitting context on Out. Waits
          for Out port to complete, then waits [delay] ms before next emit. Click
          Stop to pause. Survives pod restarts via metadata persistence.
        name: ticker
        tags:
        - SDK
      image: ghcr.io/tiny-systems/common-module:0.9.24
      version: 0.9.24
