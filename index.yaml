  database-module:
    category: data
    description: Postgres, Redis, and vector store components
    source: github.com/tiny-systems/database-module
    versions:
    - chart: tinysystems/tinysystems-operator
      chartVersion: 0.2.10
      components:
      - description: Postgres Exec
        info: Executes INSERT/UPDATE/DELETE against Postgres with positional parameters.
          Connection pool is cached per DSN across calls.
        name: postgres_exec
        tags:
        - Postgres
        - SQL
        - DB
      - description: Postgres Query
        info: Runs SELECT against Postgres and returns rows as a list of objects keyed
          by column name. Configure expected row shape in settings so downstream edges
          can navigate the result. Connection pool is cached per DSN.
        name: postgres_query
        tags:
        - Postgres
        - SQL
        - DB
      - description: Redis Dedup
        info: Atomic 'first seen' check via SET NX EX. Routes new IDs to the New port
          and duplicates to the Seen port. Redis client is cached per URL across calls.
        name: redis_dedup
        tags:
        - Redis
        - Dedup
        - DB
      - description: Redis Get
        info: Reads a key from Redis. Emits found=false with empty value when the
          key does not exist; the error port is reserved for actual Redis failures.
        name: redis_get
        tags:
        - Redis
        - DB
      - description: Redis Set
        info: Sets a key in Redis. Optional TTL via ttlSeconds (0 = no expiry). Optional
          NX (set only if key does not already exist).
        name: redis_set
        tags:
        - Redis
        - DB
      - description: Vector Search
        info: kNN over a pgvector column. Returns the top-K nearest rows by configurable
          distance metric, with a normalised score in [0,1]. Optional JSONB metadata
          filter restricts the search. Pair with vector_upsert to build a RAG store
          — on the zero-config bundle a query before anything is stored returns an
          empty result (not an error), so the question path answers gracefully on
          an empty memory.
        name: vector_search
        tags:
        - Vectors
        - Postgres
        - pgvector
        - RAG
        - DB
        - kNN
      - description: Vector Upsert
        info: 'Writes an embedding row into a pgvector table. INSERT ... ON CONFLICT
          (id) DO UPDATE — existing rows are overwritten. Zero-config on the in-cluster
          bundle: leave DSN empty and the table is created automatically on first
          write (vector dimension inferred from the embedding), and an empty id is
          auto-generated — so wire embed_text.embedding straight into this node''s
          embedding with NO id-generating node in between. Only an explicit external
          DSN requires you to pre-create the table.'
        name: vector_upsert
        tags:
        - Vectors
        - Postgres
        - pgvector
        - RAG
        - DB
      image: ghcr.io/tiny-systems/database-module:0.6.11
      version: 0.6.11
