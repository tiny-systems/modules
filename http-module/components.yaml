# Generated by `tools components-info --json` at release. Do not edit by hand.
# Discovery only: name/description/info/tags. Ports come from a running node.
- name: http_auth_parse
  description: Basic Auth Headers Parser
  info: 'Extracts Basic Auth credentials from HTTP headers. In port receives: context + headers array.
    Out port always emits: {context, found, user, password}. If Authorization header with ''Basic'' scheme
    found, decodes base64 and sets found=true with user/password. Otherwise found=false.'
  tags:
  - HTTP
  - Auth
- name: http_request
  description: HTTP Client
  info: 'Outbound HTTP request maker. Request port receives: context, method, timeout, URL, headers, contentType,
    body. Blocks until HTTP response received. On success (status < 400): emits context + response on
    Response port. On failure or status >= 400: returns error, or if enableErrorPort=true in settings,
    emits on Error port instead.'
  tags:
  - HTTP
  - Client
- name: logql_query
  description: LogQL Query
  info: 'Searches Loki for log lines across every pod at once, which is what pod_logs_get cannot do —
    it needs an exact pod name. Returns each line with its stream labels, so an agent can say which pod
    and namespace produced it. The query needs a stream selector in braces: {namespace="prod"} |= "error".
    Addressed by URL, so an in-cluster Loki and Grafana Cloud work the same way; set the tenant header
    for multi-tenant installs. Give the credential per request from the trigger widget rather than storing
    it in the flow. Check truncated before concluding anything — a capped sample is not the whole picture.'
  tags:
  - Observability
  - Logs
  - Agent
- name: promql_query
  description: PromQL Query
  info: Runs a PromQL query against any Prometheus-compatible API and returns the matching series with
    their labels. Set rangeMinutes to query a window instead of an instant — that is what shows a trend
    rather than a single number. Addressed by URL, so it works with an in-cluster Prometheus as well as
    Grafana Cloud, Amazon Managed Prometheus, Thanos, Mimir or VictoriaMetrics; set the tenant header
    for the multi-tenant ones. Give the credential per request from the trigger widget rather than storing
    it in the flow. A malformed query is permanent and will not be retried; an unreachable or overloaded
    backend is retryable.
  tags:
  - Observability
  - Metrics
  - Agent
- name: http_server
  description: HTTP Server
  info: HTTP request handler. The server does NOT run until a message arrives on the Start port — wire
    a signal (or cron) into Start to launch it (a cron would re-launch on every tick, so prefer signal
    for a long-running server). On start it exposes a public URL; read that URL from the _control port's
    ListenAddr (or enable the status port) — never guess the address. Each incoming HTTP request emits
    on Request port. Wire Request to processing logic, then wire result to Response port with statusCode
    (required), contentType (required), headers, body. To stop the server, enable the Stop port in settings
    and send it any message (context cancellation alone will NOT stop it — the runtime is distributed
    and durable).
  tags:
  - HTTP
  - Server
  - sync_rpc
