- name: sandbox_run
  description: Sandbox Run
  info: 'Runs a script in a throwaway Kubernetes Job and returns its output and exit code. Built for code
    an agent wrote: the container runs as non-root with a read-only root filesystem, no service-account
    token, dropped capabilities, and CPU/memory limits, and is deleted after it finishes. A script that
    exits non-zero is a normal Result with that exit code, not a flow failure — only infrastructure problems
    reach the Error port. Blocks until the script finishes, so keep it short; the timeout is capped at
    240s. The script is passed to the interpreter as an argument, so choose an image that contains it
    (python:3.12-slim, node:22-alpine, busybox). Nothing restricts network egress by default — run it
    in a namespace with a restrictive NetworkPolicy if the script must not reach the cluster.'
  tags:
  - Kubernetes
  - Sandbox
  - Agent
