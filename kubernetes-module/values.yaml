rbac:
  enableKubernetesResourceAccess: true
  extraRules:
  - apiGroups:
    - apps
    resources:
    - deployments
    verbs:
    - update
    - patch
  - apiGroups:
    - apps
    resources:
    - statefulsets
    - daemonsets
    verbs:
    - get
    - list
    - watch
    - update
    - patch
  - apiGroups:
    - ""
    resources:
    - configmaps
    verbs:
    - get
    - create
    - update
    - patch
  - apiGroups:
    - ""
    resources:
    - events
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - admissionregistration.k8s.io
    resources:
    - mutatingwebhookconfigurations
    verbs:
    - get
    - create
    - update
    - delete
  - apiGroups:
    - ""
    resources:
    - pods/log
    verbs:
    - get
  - apiGroups:
    - ""
    resources:
    - pods
    verbs:
    - create
    - delete
  - apiGroups:
    - batch
    resources:
    - jobs
    verbs:
    - create
    - get
    - list
    - watch
    - delete

  # secret_get reads a Secret by namespace and name. As a cluster rule that
  # meant every Secret in the cluster — kube-system included — so a component
  # meant to fetch one registry credential could fetch all of them. Namespaced,
  # it reads the secrets sitting alongside the runtime, which is the boundary
  # the chart already documents.
  extraNamespacedRules:
  - apiGroups:
    - ""
    resources:
    - secrets
    verbs:
    - get
    - list
