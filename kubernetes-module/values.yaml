# enableKubernetesResourceAccess is a bundle: pods, deployments, services and
# ingresses, every one of them with update, cluster-wide. This module reads
# pods and restarts workloads; it has never written a Service or an Ingress.
# The bundle handed it the ability to repoint any service and rewrite any
# ingress in the cluster.
#
# Spelled out instead: read what it reads, write only the workloads it exists
# to restart. custom_resource_list keeps working for these kinds and reports a
# 403 with the helm command for anything else, which is its documented
# contract.
rbac:
  enableKubernetesResourceAccess: false
  extraRules:
  - apiGroups:
    - ''
    resources:
    - pods
    - services
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - apps
    resources:
    - deployments
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - networking.k8s.io
    resources:
    - ingresses
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - apps
    resources:
    - deployments
    verbs:
    - update
    - patch
  - apiGroups:
    - apps
    resources:
    - statefulsets
    - daemonsets
    verbs:
    - get
    - list
    - watch
    - update
    - patch
  - apiGroups:
    - ''
    resources:
    - configmaps
    verbs:
    - get
    - create
    - update
    - patch
  - apiGroups:
    - ''
    resources:
    - events
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - admissionregistration.k8s.io
    resources:
    - mutatingwebhookconfigurations
    verbs:
    - get
    - create
    - update
    - delete
  - apiGroups:
    - ''
    resources:
    - pods/log
    verbs:
    - get
  - apiGroups:
    - ''
    resources:
    - pods
    verbs:
    - create
    - delete
  - apiGroups:
    - batch
    resources:
    - jobs
    verbs:
    - create
    - get
    - list
    - watch
    - delete
  extraNamespacedRules:
  - apiGroups:
    - ''
    resources:
    - secrets
    verbs:
    - get
    - list
